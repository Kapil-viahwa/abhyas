name: CI

on:
  push:
    branches:
      - main
      # A phase branch is verified on push as well as on its pull request, so a
      # slice is checked even before a PR exists. The concurrency key includes the
      # event name, so the push and pull-request runs do not cancel each other.
      - 'phase-*'
  pull_request:

permissions:
  contents: read

concurrency:
  # Keyed by event as well as ref: a push and the pull-request run for the same
  # commit are separate requests and must not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Used by `prisma generate` (which never connects) and by the database job.
  DATABASE_URL: postgresql://abhyas_app:abhyas_app@localhost:5432/abhyas
  MIGRATION_DATABASE_URL: postgresql://abhyas:abhyas@localhost:5432/abhyas
  APP_DATABASE_URL: postgresql://abhyas_app:abhyas_app@localhost:5432/abhyas
  REDIS_URL: redis://localhost:6379
  # The database job has no object store, so it uses the in-memory one, which the
  # production environment refuses. The compose jobs use the real MinIO service.
  S3_ENDPOINT: 'memory:'
  S3_REGION: us-east-1
  S3_BUCKET: abhyas-media
  S3_ACCESS_KEY_ID: abhyas-dev
  S3_SECRET_ACCESS_KEY: abhyas-dev-secret
  S3_FORCE_PATH_STYLE: 'true'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abhyas
          POSTGRES_PASSWORD: abhyas
          POSTGRES_DB: abhyas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abhyas -d abhyas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Create the application database role
        shell: bash
        env:
          PGPASSWORD: abhyas
        run: |
          set -o pipefail
          psql -h localhost -U abhyas -d abhyas -v ON_ERROR_STOP=1 -f docker/postgres-init/01-app-role.sql 2>&1 | tee "$RUNNER_TEMP/app-role.log"
      - name: Migration test against Postgres 16
        shell: bash
        run: |
          set -o pipefail
          pnpm test:db 2>&1 | tee "$RUNNER_TEMP/database.log"
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images
        shell: bash
        run: |
          set -o pipefail
          docker compose build 2>&1 | tee "$RUNNER_TEMP/docker-build.log"
      - name: Validate production compose
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-compose-prod.mjs 2>&1 | tee "$RUNNER_TEMP/compose-validate.log"
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bring the stack up and wait for health
        shell: bash
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee "$RUNNER_TEMP/compose-up.log"
          docker compose ps | tee "$RUNNER_TEMP/compose-ps.log"
      - name: Curl the health endpoint and the two front doors
        shell: bash
        run: |
          set -o pipefail
          curl -fsS http://localhost:3001/health | tee "$RUNNER_TEMP/health.log"
          curl -fsS http://localhost:3001/api/docs-json -o /dev/null
          curl -fsS http://localhost:3000/ -o /dev/null
      # Every container that can fail at boot is read here, not just the API: a `--wait`
      # failure only says "container X exited (1)", and the reason is in that container's
      # own log. The worker's last lines are also raised as annotations, because a long log
      # step is truncated exactly where it is read.
      - name: Collect container logs
        if: failure()
        shell: bash
        run: |
          docker compose ps -a > "$RUNNER_TEMP/compose-ps.log" 2>&1 || true
          for service in migrate worker api web; do
            docker compose logs --no-color "$service" > "$RUNNER_TEMP/$service-logs.log" 2>&1 || true
            if [ "$service" = "worker" ]; then
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  echo "::error title=worker::${line//'%'/%25}"
                fi
              done < <(tail -n 15 "$RUNNER_TEMP/$service-logs.log")
            fi
            {
              echo "### $service container log (last 80 lines)"
              echo '```'
              tail -n 80 "$RUNNER_TEMP/$service-logs.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- $service ---"
            tail -n 80 "$RUNNER_TEMP/$service-logs.log"
          done
      - name: Tear the stack down
        if: always()
        shell: bash
        run: |
          docker compose logs --no-color > "$RUNNER_TEMP/compose-logs.log" 2>&1 || true
          docker compose down -v > "$RUNNER_TEMP/compose-down.log" 2>&1 || true
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # Two stack boots and two Playwright runs measured at about six minutes, but slow runners
    # have twice approached the old twelve-minute cap and had the job cancelled while the
    # tests were still passing. Twenty leaves room for that variance; Playwright's own global
    # timeout (eight minutes) still fails a hung suite, so a stuck browser cannot hold the job
    # open.
    #
    # The job cap is a ceiling, not the first line of defence: the steps that wait on Docker
    # each carry their own timeout-minutes, shorter than both the job cap and the wait flags
    # they give compose, so a stack that will not come up fails the step in minutes and still
    # leaves time for "Collect container logs" below to run.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
      # The browser download is the only step that has ever blown this job's budget: 9m22s on
      # `7790330` and 11m16s on `bd37281`, against 16-21s when the CDN behaves (decision 0067).
      # The browsers themselves are cached per runner OS and per installed Playwright version.
      # The OS packages `--with-deps` pulls in are not in that cache, so a hit still runs
      # `install-deps`: a restored Chromium without libnss3 and its neighbours does not launch.
      - name: Read the Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(pnpm exec playwright --version 2>/dev/null | awk '{print $NF}')"
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        # Eight minutes. Healthy is 16-21s and the two stalled runs were 9m22s and 11m16s, so a
        # download that is not going to finish fails here with its own message instead of eating
        # the job's twenty, and the stack steps plus the log collection still get to run.
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          {
            if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
              echo "browser cache hit for Playwright ${{ steps.playwright-version.outputs.version }}: installing only the OS dependencies"
              pnpm exec playwright install-deps chromium
            elif ! pnpm exec playwright install --with-deps chromium; then
              echo "::warning title=playwright::the Chromium download failed once; retrying once"
              sleep 5
              pnpm exec playwright install --with-deps chromium
            fi
          } 2>&1 | tee "$RUNNER_TEMP/playwright-install.log"
      # The stack's one-shot `migrate` service is a dependency of the API and the worker
      # (condition: service_completed_successfully), so `up` applies the migrations before
      # either boots and `--wait` is satisfied only once migrations have finished. Playwright
      # therefore always starts against a migrated, healthy stack, and the worker never
      # meets a table that does not exist yet.
      - name: Bring the stack up (migrations first) and wait for health
        # Measured at 1m36s to 1m56s on healthy runners. Six minutes leaves the step room to
        # finish, and gives `--wait-timeout 300` room to expire and print which container never
        # became healthy, before the step itself is killed.
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee "$RUNNER_TEMP/compose-up.log"
      # Both halves of the master switch, in one job. The default stack proves the switch is
      # off: the mobile screens are hidden and their routes and form posts answer 404. Then
      # the OTP override turns it on with the fake provider and a fixed code (decision 0051),
      # and the second project drives the real screens — registration, sign-in, linking with
      # re-authentication, the wrong-code lockout, the resend countdown and the identical
      # answer for a number nobody has.
      - name: Run Playwright (OTP disabled)
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --project=chromium 2>&1 | tee "$RUNNER_TEMP/playwright.log"
      - name: Restart the stack with OTP enabled
        # Measured at 13 to 15 seconds on healthy runners; six minutes is the same headroom the
        # first boot gets, so the overlay's own `--wait-timeout 300` still expires and says
        # which container failed before the step is killed.
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.otp.yml up -d --wait --wait-timeout 300 2>&1 | tee "$RUNNER_TEMP/compose-otp.log"
      # `--wait` says the containers are up, not that the new API and web are answering with
      # the new settings. The mobile page must be 200 here: that is the proof the web tier
      # really received OTP_ENABLED=true, not just the API.
      - name: Wait for the enabled stack to answer
        # Each curl carries --max-time 5, so a socket that accepts but never answers cannot
        # stall an attempt, and three minutes bounds the whole step: a stack that never comes
        # back fails here, with the container logs still to come, instead of at the job cap.
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:3001/health > /dev/null \
              && curl -fsS --max-time 5 http://localhost:3000/ > /dev/null \
              && curl -fsS --max-time 5 http://localhost:3000/register/mobile > /dev/null; then
              echo "the enabled stack is answering, with the mobile page at 200"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the stack did not come back with OTP enabled"
          docker compose -f docker-compose.yml -f docker-compose.otp.yml logs --no-color --tail 80 api web || true
          exit 1
      - name: Run Playwright (OTP enabled, fake provider)
        shell: bash
        env:
          E2E_OTP: '1'
        run: |
          set -o pipefail
          pnpm exec playwright test --project=otp 2>&1 | tee "$RUNNER_TEMP/playwright-otp.log"
      # Every container that can fail at boot is read here, not just the API: a `--wait`
      # failure only says "container X exited (1)", and the reason is in that container's
      # own log. The worker's last lines are also raised as annotations, because a long log
      # step is truncated exactly where it is read. `always()` rather than `failure()`: a job
      # cancelled at its timeout is not a failure, and the state of the stack at that moment —
      # ps, plus the tail of postgres, migrate, api and worker — is exactly what is missing
      # when a run is cancelled.
      - name: Collect container logs
        if: always()
        shell: bash
        run: |
          docker compose ps -a > "$RUNNER_TEMP/compose-ps.log" 2>&1 || true
          for service in postgres migrate worker api web; do
            docker compose logs --no-color "$service" > "$RUNNER_TEMP/$service-logs.log" 2>&1 || true
            if [ "$service" = "worker" ]; then
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  echo "::error title=worker::${line//'%'/%25}"
                fi
              done < <(tail -n 15 "$RUNNER_TEMP/$service-logs.log")
            fi
            {
              echo "### $service container log (last 80 lines)"
              echo '```'
              tail -n 80 "$RUNNER_TEMP/$service-logs.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- $service ---"
            tail -n 80 "$RUNNER_TEMP/$service-logs.log"
          done
      - name: Tear the stack down
        if: always()
        shell: bash
        run: |
          docker compose logs --no-color > "$RUNNER_TEMP/compose-logs.log" 2>&1 || true
          docker compose down -v > "$RUNNER_TEMP/compose-down.log" 2>&1 || true
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          # The report and the trace of every failed test, uploaded even when the job is
          # cancelled or times out, so a failure always leaves its evidence behind.
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # gitleaks-action lists the pull request's commits to scope its scan, which
    # needs pull-requests: read. Without it the action fails with
    # "Resource not accessible by integration" (403) on /pulls/{n}/commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Audit dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:ci 2>&1 | tee "$RUNNER_TEMP/audit.log"
      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-${{ github.job }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
