name: Lockfile bootstrap

# TEMPORARY, again: two dependency versions changed for the audit gate and this machine
# cannot run pnpm. Regenerates pnpm-lock.yaml in CI and commits only that file. Deleted
# again in the same pull request once the lockfile is in.

on:
  push:
    branches: ['phase-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync pnpm-lock.yaml
    if: "github.ref_name != 'main'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Regenerate pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/lockfile.log"

      - name: Commit only pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          git config user.name "lockfile-bootstrap"
          git config user.email "lockfile-bootstrap@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git commit -m "chore: sync pnpm-lock.yaml" | tee "$RUNNER_TEMP/commit.log"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "$RUNNER_TEMP/push.log"
