name: Lockfile bootstrap

# Temporary: this branch adds a dependency (@node-rs/argon2), and a lockfile can only
# be produced by a package manager. This workflow regenerates pnpm-lock.yaml in CI and
# commits it, so the frozen installs can resolve. It is removed again once committed.

on:
  workflow_dispatch:
  push:
    branches:
      - phase-2a

permissions:
  contents: read

jobs:
  generate:
    name: generate lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      # No `cache: pnpm`: setup-node resolves its cache key from the lockfile it is
      # about to be regenerated against, and fails when the file is stale.
      - name: Setup node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Regenerate pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/lockfile.log"

      - name: Commit lockfile
        shell: bash
        run: |
          set -o pipefail
          git config user.name "lockfile-bootstrap"
          git config user.email "lockfile-bootstrap@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git commit -m "chore: refresh pnpm-lock.yaml" | tee "$RUNNER_TEMP/commit.log"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "$RUNNER_TEMP/push.log"

      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-lockfile-bootstrap
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
