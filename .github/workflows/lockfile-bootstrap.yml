name: Lockfile bootstrap

# pnpm-lock.yaml cannot be generated anywhere that has no package manager.
# This tunnel generates it in CI and commits it to the branch it runs on, so the
# frozen-lockfile installs in ci.yml can run. Trigger it manually, once, per
# dependency change that was made without a local install.
# Read-only by default; only the job that commits is granted write access.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/lockfile.log"

      - name: Commit lockfile
        shell: bash
        run: |
          set -o pipefail
          git config user.name "lockfile-bootstrap"
          git config user.email "lockfile-bootstrap@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git commit -m "chore: generate pnpm-lock.yaml" | tee "$RUNNER_TEMP/commit.log"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "$RUNNER_TEMP/push.log"

      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-lockfile-bootstrap
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
