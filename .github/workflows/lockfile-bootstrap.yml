name: Lockfile bootstrap

# TEMPORARY. Phase 4 adds dependencies that cannot be installed on the machine this
# branch was written on, so this workflow regenerates pnpm-lock.yaml in CI and commits
# only that file. It is deleted again in the same pull request once the lockfile is in.
#
# It skips its own commit so it cannot loop, and it is never allowed on main.

on:
  push:
    branches: ['phase-*']

permissions:
  contents: read

jobs:
  sync:
    name: sync pnpm-lock.yaml
    if: github.ref_name != 'main' && !contains(github.event.head_commit.message, 'chore: sync pnpm-lock.yaml')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      # No `cache: pnpm`: the cache key comes from the very lockfile being replaced.
      - name: Setup node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Regenerate pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/lockfile.log"

      - name: Commit only pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          git config user.name "lockfile-bootstrap"
          git config user.email "lockfile-bootstrap@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git commit -m "chore: sync pnpm-lock.yaml" | tee "$RUNNER_TEMP/commit.log"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "$RUNNER_TEMP/push.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-lockfile-bootstrap
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
