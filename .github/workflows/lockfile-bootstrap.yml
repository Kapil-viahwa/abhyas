name: Lockfile bootstrap

# A repository with no pnpm-lock.yaml cannot run a frozen install, and a lockfile
# can only be produced by a package manager. Until the first lockfile is
# committed, this workflow also runs on push to the phase branch: it generates
# the lockfile and commits it. That push trigger is temporary and is removed as
# soon as the lockfile exists; afterwards this workflow is manual-only
# (workflow_dispatch) for dependency changes made without a local install.
#
# Read-only by default; only the generating job is granted write access.

on:
  workflow_dispatch:
  push:
    branches:
      - phase-0

permissions:
  contents: read

jobs:
  generate:
    name: generate lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check whether the lockfile already exists
        id: guard
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml is already committed; nothing to generate."
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No pnpm-lock.yaml yet; generating one."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.generate == 'true'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      # No `cache: pnpm` here on purpose: setup-node resolves its cache key from
      # pnpm-lock.yaml and fails when the file does not exist, which is the exact
      # situation this job exists to fix.
      - name: Setup node
        if: steps.guard.outputs.generate == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate pnpm-lock.yaml
        if: steps.guard.outputs.generate == 'true'
        shell: bash
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/lockfile.log"

      - name: Commit lockfile
        if: steps.guard.outputs.generate == 'true'
        shell: bash
        run: |
          set -o pipefail
          git config user.name "lockfile-bootstrap"
          git config user.email "lockfile-bootstrap@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git commit -m "chore: generate pnpm-lock.yaml" | tee "$RUNNER_TEMP/commit.log"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "$RUNNER_TEMP/push.log"

      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-lockfile-bootstrap
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
