name: Lockfile sync

# Regenerates pnpm-lock.yaml on the branch it is dispatched for and commits only that
# file, so a dependency change made without a local package manager can still be
# verified by the frozen-lockfile installs in ci.yml.
#
# Deliberately manual-only, deliberately not allowed on main (a lockfile change is a
# review item, never a direct commit on the release branch), and the only workflow
# granted write access — scoped to the single job that commits.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync pnpm-lock.yaml
    if: github.ref_name != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      # No `cache: pnpm`: setup-node derives its cache key from the very lockfile this
      # job is about to replace, and fails when the file is out of date.
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Regenerate pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/lockfile.log"

      - name: Commit only pnpm-lock.yaml
        shell: bash
        run: |
          set -o pipefail
          git config user.name "lockfile-sync"
          git config user.email "lockfile-sync@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git commit -m "chore: sync pnpm-lock.yaml" | tee "$RUNNER_TEMP/commit.log"
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1 | tee "$RUNNER_TEMP/push.log"

      - name: Failure summary
        if: failure()
        run: node scripts/ci-failure-summary.mjs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: logs-lockfile-sync
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
