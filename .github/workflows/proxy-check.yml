name: Proxy check

# Proves the edge configuration in deploy/nginx/ against a stub upstream: the redirect, the
# overwritten forwarding headers, HSTS, the TLS floor, the closed default servers, the 404s,
# the body limit and the rate limit. It runs only when the edge files change, and never on the
# nine CI jobs. No certificate or key is committed: a one-day self-signed pair is generated.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/nginx/**
      - docs/deployment.md
      - .github/workflows/proxy-check.yml

permissions:
  contents: read

concurrency:
  group: proxy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy:
    name: proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate a throwaway certificate for the test host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/certs/privkey.pem" \
            -out "$RUNNER_TEMP/certs/fullchain.pem" \
            -subj "/CN=abhyas.test" \
            -addext "subjectAltName=DNS:abhyas.test"
          cp "$RUNNER_TEMP/certs/fullchain.pem" "$RUNNER_TEMP/certs/chain.pem"
      - name: Render the configuration for the test host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nginx" "$RUNNER_TEMP/webroot/.well-known/acme-challenge"
          echo "acme-ok" > "$RUNNER_TEMP/webroot/.well-known/acme-challenge/token"
          sed -e 's|__DOMAIN__|abhyas.test|g' \
              -e 's|/etc/letsencrypt/live/abhyas.test|'"$RUNNER_TEMP"'/certs|g' \
              -e 's|/var/www/certbot|'"$RUNNER_TEMP"'/webroot|g' \
              -e 's|resolver 127.0.0.53|resolver 1.1.1.1|' \
              deploy/nginx/abhyas.conf > "$RUNNER_TEMP/nginx/abhyas.conf"
          cp deploy/nginx/abhyas-proxy.conf "$RUNNER_TEMP/nginx/abhyas-proxy.conf"
          sed -i 's|/etc/nginx/abhyas-proxy.conf|/etc/nginx/conf.d/abhyas-proxy.conf|g' "$RUNNER_TEMP/nginx/abhyas.conf"
      - name: Write the stub upstream configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nginx/upstream.conf" <<'CONF'
          server {
            listen 3000;
            location / {
              add_header Content-Type text/plain always;
              return 200 "xri=$http_x_real_ip|xff=$http_x_forwarded_for|xfp=$http_x_forwarded_proto|host=$http_host|fwd=$http_forwarded|xfh=$http_x_forwarded_host";
            }
          }
          CONF
      - name: Start the two containers
        shell: bash
        run: |
          set -euo pipefail
          docker network create edge >/dev/null 2>&1 || true
          docker rm -f upstream >/dev/null 2>&1 || true
          docker run -d --name upstream --network edge \
            -v "$RUNNER_TEMP/nginx/upstream.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine >/dev/null
          # The edge shares the stub's network namespace so 127.0.0.1:3000 is the stub, exactly as
          # the host-proxy-to-loopback-port arrangement does in production.
          docker run -d --name edge --network edge --network-alias edge \
            -p 127.0.0.1:8080:80 -p 127.0.0.1:8443:443 \
            -v "$RUNNER_TEMP/nginx/abhyas.conf:/etc/nginx/conf.d/abhyas.conf:ro" \
            -v "$RUNNER_TEMP/nginx/abhyas-proxy.conf:/etc/nginx/conf.d/abhyas-proxy.conf:ro" \
            -v "$RUNNER_TEMP/certs:/certs:ro" nginx:1.27-alpine >/dev/null
          sleep 3
          docker logs edge 2>&1 | tail -n 20
          docker exec edge nginx -t
      - name: Run the checks
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          check() { if [ "$1" = "0" ]; then echo "PASS $2" >> "$GITHUB_STEP_SUMMARY"; else echo "FAIL $2" >> "$GITHUB_STEP_SUMMARY"; failures=$((failures+1)); fi; }

          # The edge publishes on 8080/8443 in this job; the config's $remote_addr is this runner.
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.well-known/acme-challenge/token | grep -qx 200
          check $? "ACME challenge served on port 80"
          curl -s -o /dev/null -D - http://127.0.0.1:8080/ | grep -qi '^location: https://'
          check $? "HTTP redirects to https"
          body=$(curl -sk --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/ \
            -H 'X-Forwarded-For: 1.2.3.4' -H 'X-Real-IP: 5.6.7.8' \
            -H 'Forwarded: for=9.9.9.9' -H 'X-Forwarded-Host: evil.example')
          echo "$body" | grep -q 'xff=1.2.3.4' && check 1 "X-Forwarded-For is overwritten" || check 0 "X-Forwarded-For is overwritten"
          echo "$body" | grep -q 'xri=5.6.7.8' && check 1 "X-Real-IP is overwritten" || check 0 "X-Real-IP is overwritten"
          echo "$body" | grep -q 'fwd=' && check 1 "Forwarded is blanked" || check 0 "Forwarded is blanked"
          echo "$body" | grep -q 'xfp=https' && check 0 "X-Forwarded-Proto is https" || check 1 "X-Forwarded-Proto is https"
          curl -sk -D - --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/ | grep -qi '^strict-transport-security:'
          check $? "HSTS present"
          curl -sk -D - --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/ | grep -qi '^server: nginx/[0-9]'
          [ $? -ne 0 ] && check 0 "no Server version token" || check 1 "no Server version token"
          curl -sk -o /dev/null -w '%{http_code}' --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/internal/x | grep -qx 404
          check $? "/internal/ answers 404"
          curl -sk -o /dev/null -w '%{http_code}' --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/api/docs | grep -qx 404
          check $? "/api/docs answers 404"
          curl -s -o /dev/null -w '%{http_code}' --resolve abhyas.test:8080:127.0.0.1 -H 'Host: evil.example' http://127.0.0.1:8080/ | grep -qx 444
          check $? "unknown Host is closed"
          head -c 3000000 /dev/zero | curl -sk --resolve abhyas.test:8443:127.0.0.1 -o /dev/null -w '%{http_code}' --data-binary @- https://abhyas.test:8443/ | grep -qx 413
          check $? "oversized body answers 413"
          curl -sk --tlsv1.2 --tls-max 1.2 -o /dev/null --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/
          check $? "TLS 1.2 accepted"
          curl -sk --tlsv1.1 -o /dev/null --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/ 2>/dev/null
          [ $? -ne 0 ] && check 0 "TLS 1.1 refused" || check 1 "TLS 1.1 refused"
          for i in $(seq 1 40); do curl -sk -o /dev/null --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/login; done
          curl -sk -o /dev/null -w '%{http_code}' --resolve abhyas.test:8443:127.0.0.1 https://abhyas.test:8443/login | grep -qx 429
          check $? "auth path rate-limits with 429"

          docker logs edge 2>&1 | tail -n 40
          exit $failures
      - name: Tear down
        if: always()
        shell: bash
        run: |
          docker logs edge > "$RUNNER_TEMP/edge.log" 2>&1 || true
          docker rm -f edge upstream >/dev/null 2>&1 || true
          docker network rm edge >/dev/null 2>&1 || true
