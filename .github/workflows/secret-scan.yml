name: Secret scan (full history)

# The per-push gitleaks job in `ci.yml` stays fast: it scans only the pushed commit or the pull
# request's own range ("1 commits scanned" on a pull request, "0" on a merge commit). This job is
# the other half — the whole history of the repository, every branch and tag, run weekly, on
# demand, and whenever this workflow's own file changes. Values never appear: gitleaks runs with
# `--redact` and the job fails on any finding.
#
# The scanner is the official gitleaks container, pinned to the version the CI action currently
# installs (8.24.3), so the two agree on rules and default config. The repository's own allowlist
# (`.gitleaks.toml`) is used explicitly instead of the image's defaults.

on:
  schedule:
    # Mondays, 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
  # Intended and permanent: when this file itself changes, the full-history scan runs on that pull
  # request, so a broken scan is caught by the change that broke it rather than by the next Monday.
  # A pull_request run uses the workflow as the pull request has it, not main's copy.
  pull_request:
    paths:
      - .github/workflows/secret-scan.yml

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-history:
    name: full-history secret scan
    runs-on: ubuntu-24.04
    # The scan itself takes seconds; the cap is for a runner or a download that will not finish.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, every branch and every tag, or the scan cannot see the history.
          fetch-depth: 0

      # A pull_request checks out the merge commit (`refs/pull/N/merge`) and checkout makes no
      # promise about the other branches being present. Fetch them all explicitly, so the scan below
      # covers every branch and tag rather than only the two parents of that merge.
      - name: Fetch every branch and tag
        shell: bash
        run: |
          git fetch --prune --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Count the commits in scope
        shell: bash
        run: |
          echo "commits in scope: $(git rev-list --all --count)"

      - name: Scan the whole history
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git . \
              --log-opts=--all \
              --redact \
              -v \
              --exit-code=2 \
              --config .gitleaks.toml \
              2>&1 | tee "$RUNNER_TEMP/secret-scan.log"

      - name: Upload the scan log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan
          path: ${{ runner.temp }}/secret-scan.log
          if-no-files-found: ignore
          retention-days: 7
