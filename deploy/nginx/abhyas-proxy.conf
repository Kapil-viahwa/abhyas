# The proxy rules every location in abhyas.conf includes.
#
# Overwrite, never append: `$remote_addr` is the address Nginx accepted the connection
# from. `$proxy_add_x_forwarded_for` would keep whatever the browser sent, which is the
# one thing the tiers are built not to read (decision 0055).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Headers the application never reads are blanked, so a client cannot smuggle one
# through to a future version of the web tier that might.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";

proxy_redirect off;
proxy_buffering on;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

# Keepalive to the upstream defined in abhyas.conf.
proxy_set_header Connection "";
