# Abhyas edge: Nginx on the host in front of the loopback-only web port.
#
# Place this file at /etc/nginx/conf.d/abhyas.conf (it is a full server block, so it
# belongs in conf.d, not in nginx.conf). Replace __DOMAIN__ with the real host name
# everywhere before enabling it; the certificate paths are the ones certbot creates.
#
# What this file owns: TLS, the HTTP-01 challenge, the redirect to https, HSTS, the
# forwarding headers (overwritten, never appended), the request/body limits and the
# coarse edge rate limits.
# What the application owns and this file must never set: Content-Security-Policy,
# X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy and
# Cache-Control. The web tier sends them (apps/web/src/lib/security-headers.ts); a second
# copy at the edge would either be ignored or conflict.
#
# Validate with: nginx -t   (paths must exist for the certificate directives to load)

# The sign-in, registration, password-reset and OTP surfaces: generous, because a school
# computer lab or an office can share one NAT address, and the application's own
# per-account limits remain the real control.
limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_edge:10m rate=120r/m;

# Keepalive to the web container published on loopback by docker-compose.prod.yml
# (127.0.0.1:${WEB_PORT:-3000}:3000).
upstream abhyas_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Port 80, the default: anything whose Host Nginx does not serve is closed, never
# redirected (a redirect would tell the caller which name is configured).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# Port 80, the configured host: only the ACME challenge is served, the rest redirects.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443, the default: close unknown Hosts. The handshake still needs a certificate,
# and it is the one the configured host uses.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# Port 443, the configured host: the application.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:abhyas_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (the resolver is the host's, not Docker's).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    # HSTS is the one security header the application does not send. No preload: this
    # host name is not submitted to the preload list; no includeSubDomains unless every
    # subdomain is https (see docs/deployment.md).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The largest legitimate body the web tier accepts. The API's own JSON limit is 1 MB
    # (apps/api/src/bootstrap.ts:24), media uploads go to S3 by presigned URL and never
    # through this proxy, and the largest form post (bulk CSV, question HTML, attempt
    # answers) is well under 1 MB; 2m leaves room for multipart framing without letting an
    # unauthenticated caller buffer anything large.
    client_max_body_size 2m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Attempt answers are submitted as one form post; the API allows 30 s for a request
    # (decision 0059), so the edge gives it the same 30 s and a little more for the
    # response, and never less than the API, which would cut a submit before the API's
    # own timeout could answer it.
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    # The edge's own rate limit, as defence in depth: 30 requests a minute per address on
    # the auth forms with a burst of 20, 120 a minute elsewhere with a burst of 60.
    #
    # Every proxying location includes the same abhyas-proxy.conf: `proxy_set_header` in a
    # location replaces *all* inherited ones, so a location that sets any header of its own
    # would silently drop the overwrite. None of them set one.
    location ~ ^/(login|register|forgot-password|reset-password|login/mobile|register/mobile)$ {
        limit_req zone=auth_edge burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/abhyas-proxy.conf;
    }

    location ~ ^/api/auth/(login|register|forgot-password|reset-password|mobile)(/|$) {
        limit_req zone=auth_edge burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/abhyas-proxy.conf;
    }

    # Attempt starts and submits carry their own application limits and must never be cut
    # by the edge: 120 r/m with a burst of 60, and the 35 s proxy timeout above.
    location ~ ^/api/attempts/(start|[0-9a-f-]+/(state|submit))$ {
        limit_req zone=general_edge burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/abhyas-proxy.conf;
    }

    location / {
        limit_req zone=general_edge burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/abhyas-proxy.conf;
    }

    # The API's internal routes and the docs are not part of the public surface; the web
    # tier never proxies them and the edge refuses them explicitly.
    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/docs {
        return 404;
    }

    # Dotfiles, except the ACME path served on port 80 above.
    location ~ /\. {
        return 404;
    }

    autoindex off;
}
