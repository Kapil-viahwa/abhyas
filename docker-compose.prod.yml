name: abhyas-prod

# Production compose: no published database or Redis ports, no development
# shortcuts, no default secrets. Every secret is required from the environment
# by name, so `docker compose config` itself fails when one is missing.
# Validate with: node scripts/validate-compose-prod.mjs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      ['sh', '-c', 'cd /repo/apps/api && node node_modules/prisma/build/index.js migrate deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # An external, private S3-compatible store. The API refuses development credentials
      # and any non-https endpoint in production (decision 0038).
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: 'false'
      # The only proxy allowed to state a client address: the web container, by its exact
      # address on this compose network. Never a subnet and never the internet (decision
      # 0052): anything wider would let an address the attacker chooses pick its own bucket.
      TRUST_PROXY: '172.31.0.10/32'
      # The one header the web container writes, and the only one this API reads
      # (decision 0055). Nginx overwrites X-Real-IP, so the web tier forwards it under
      # the same name; X-Forwarded-For is never read here.
      TRUST_CLIENT_IP_HEADER: 'x-real-ip'
      # The web container's own address: never route a cache drop through the public edge.
      REVALIDATE_URL: http://web:3000/api/revalidate
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # One hop in front of this tier: Nginx, on the host, which overwrites X-Real-IP with
      # $remote_addr (docs/deployment.md). A count, not "true": the browser can send both
      # headers itself (decision 0052).
      TRUST_PROXY: '1'
      # Exactly one header is read, and it is the one Nginx overwrites (decision 0055).
      TRUST_CLIENT_IP_HEADER: 'x-real-ip'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      # Loopback only: Docker publishes around ufw, so a port bound on every interface is
      # reachable from the internet even when the firewall says otherwise. Only the host's
      # Nginx may reach this tier, and it connects to 127.0.0.1 (docs/deployment.md).
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    # A fixed address so the API can name exactly this container as its trusted proxy.
    networks:
      default:
        ipv4_address: 172.31.0.10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      # The worker boots through the same validator as the API, which requires this in
      # production even though the worker never asks for a cache drop itself.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

# The default network is pinned so the web container can hold a fixed address: the API
# trusts that one address, not a subnet, as the only source of a forwarded client address.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/24
