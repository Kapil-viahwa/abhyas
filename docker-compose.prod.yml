name: abhyas-prod

# Production compose: no published database or Redis ports, no development
# shortcuts, no default secrets. Every secret is required from the environment
# by name, so `docker compose config` itself fails when one is missing.
# Validate with: node scripts/validate-compose-prod.mjs

services:
  postgres:
    # Pinned by tag and manifest-list digest: the tag alone can move under us.
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 20
    # Sized for a 4 GB VPS: the limits add up to about 3.4 GB, leaving the host room.
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # A Redis with no password inside the compose network is one misconfigured proxy away
    # from being an open queue; the API and the worker reach it with the same secret.
    #
    # The append-only file is what makes a restart survivable: queued jobs, the repeatable
    # job declarations, throttle buckets and failure counters are all Redis keys. `everysec`
    # is the documented trade-off (at most a second of writes lost on a hard crash, never a
    # corrupt file); `FLUSHALL` or dropping the volume throws all four away, and the
    # repeatable jobs are re-declared by the worker at its next boot while queued work is not.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--save',
        '60',
        '1',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      ['sh', '-c', 'cd /repo/apps/api && node node_modules/prisma/build/index.js migrate deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: 'redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379'
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # An external, private S3-compatible store. The API refuses development credentials
      # and any non-https endpoint in production (decision 0038).
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: 'false'
      # The worker's door into this API: its own secret, and exactly one source address.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      INTERNAL_ALLOWED_ADDRESSES: '172.31.0.20/32'
      # The only proxy allowed to state a client address: the web container, by its exact
      # address on this compose network. Never a subnet and never the internet (decision
      # 0052): anything wider would let an address the attacker chooses pick its own bucket.
      TRUST_PROXY: '172.31.0.10/32'
      # The one header the web container writes, and the only one this API reads
      # (decision 0055). Nginx overwrites X-Real-IP, so the web tier forwards it under
      # the same name; X-Forwarded-For is never read here.
      TRUST_CLIENT_IP_HEADER: 'x-real-ip'
      # The web container's own address: never route a cache drop through the public edge.
      REVALIDATE_URL: http://web:3000/api/revalidate
      # Mobile OTP stays off unless an operator turns it on, and the API's validator is what
      # enforces the rest: with OTP_ENABLED=true in production it refuses a boot without
      # OTP_HMAC_SECRET (32+ characters), OTP_SENDER_ID, OTP_DLT_ENTITY_ID, OTP_TEMPLATE_ID,
      # and — because SMS_PROVIDER must be "http" — an https OTP_GATEWAY_URL, a
      # OTP_GATEWAY_BODY_TEMPLATE and a OTP_GATEWAY_AUTH_VALUE. Passing them empty keeps the
      # off case clean and makes the on case fail at boot, naming the variable.
      OTP_ENABLED: ${OTP_ENABLED:-false}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      OTP_SENDER_ID: ${OTP_SENDER_ID:-}
      OTP_DLT_ENTITY_ID: ${OTP_DLT_ENTITY_ID:-}
      OTP_TEMPLATE_ID: ${OTP_TEMPLATE_ID:-}
      OTP_GATEWAY_URL: ${OTP_GATEWAY_URL:-}
      OTP_GATEWAY_AUTH_HEADER: ${OTP_GATEWAY_AUTH_HEADER:-}
      OTP_GATEWAY_AUTH_VALUE: ${OTP_GATEWAY_AUTH_VALUE:-}
      OTP_GATEWAY_BODY_TEMPLATE: ${OTP_GATEWAY_BODY_TEMPLATE:-}
      OTP_GATEWAY_TIMEOUT_MS: ${OTP_GATEWAY_TIMEOUT_MS:-5000}
      OTP_SMS_DAILY_BUDGET: ${OTP_SMS_DAILY_BUDGET:-100}
      OTP_ALLOWED_COUNTRY_CODES: ${OTP_ALLOWED_COUNTRY_CODES:-+91}
      # Required only when EMAIL_PROVIDER=smtp, which the API's SMTP sender refuses to
      # construct without; empty otherwise.
      SMTP_URL: ${SMTP_URL:-}
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # The process needs no kernel capability beyond the defaults it drops: it binds 3001,
    # reads its own files and talks over the network. `no-new-privileges` keeps a setuid
    # helper inside the image from ever gaining them back.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 640m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # The web tier hides the mobile screens and answers 404 on their routes when this is
      # false, so the switch has to be the same value the API reads.
      OTP_ENABLED: ${OTP_ENABLED:-false}
      # The origin the browser policy allows for media (presigned S3 URLs). An empty value
      # keeps the policy strict; a value must be a bare origin (no path, no credentials) and
      # the web tier refuses anything else at boot.
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
      # One hop in front of this tier: Nginx, on the host, which overwrites X-Real-IP with
      # $remote_addr (docs/deployment.md). A count, not "true": the browser can send both
      # headers itself (decision 0052).
      TRUST_PROXY: '1'
      # Exactly one header is read, and it is the one Nginx overwrites (decision 0055).
      TRUST_CLIENT_IP_HEADER: 'x-real-ip'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      # Loopback only: Docker publishes around ufw, so a port bound on every interface is
      # reachable from the internet even when the firewall says otherwise. Only the host's
      # Nginx may reach this tier, and it connects to 127.0.0.1 (docs/deployment.md).
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    # A fixed address so the API can name exactly this container as its trusted proxy.
    networks:
      default:
        ipv4_address: 172.31.0.10
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: 'redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379'
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      # The worker boots through the same validator as the API, which requires this in
      # production even though the worker never asks for a cache drop itself.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
      # Its own secret for the API's internal routes, and never the revalidation one.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      INTERNAL_ALLOWED_ADDRESSES: '172.31.0.20/32'
      # The worker boots through the same validator as the API (which refuses to start with
      # OTP on and the DLT/gateway values missing), so it is handed the same names.
      OTP_ENABLED: ${OTP_ENABLED:-false}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      OTP_SENDER_ID: ${OTP_SENDER_ID:-}
      OTP_DLT_ENTITY_ID: ${OTP_DLT_ENTITY_ID:-}
      OTP_TEMPLATE_ID: ${OTP_TEMPLATE_ID:-}
      OTP_GATEWAY_URL: ${OTP_GATEWAY_URL:-}
      OTP_GATEWAY_AUTH_HEADER: ${OTP_GATEWAY_AUTH_HEADER:-}
      OTP_GATEWAY_AUTH_VALUE: ${OTP_GATEWAY_AUTH_VALUE:-}
      OTP_GATEWAY_BODY_TEMPLATE: ${OTP_GATEWAY_BODY_TEMPLATE:-}
      OTP_GATEWAY_TIMEOUT_MS: ${OTP_GATEWAY_TIMEOUT_MS:-5000}
      OTP_SMS_DAILY_BUDGET: ${OTP_SMS_DAILY_BUDGET:-100}
      OTP_ALLOWED_COUNTRY_CODES: ${OTP_ALLOWED_COUNTRY_CODES:-+91}
      SMTP_URL: ${SMTP_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The coin-bulk and reconciliation ticks call the API's internal routes, and the
      # attempt sweeper finalises through them: the worker has nothing to do until the API
      # is answering, so it waits for its healthcheck like the web tier does.
      api:
        condition: service_healthy
    # A fixed address, so the API can name exactly this container as the one allowed to
    # present the internal secret.
    networks:
      default:
        ipv4_address: 172.31.0.20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The worker has no port to probe; the thing that can fail quietly is its queue
    # connection, so the check is a real PING over the same URL the job loop uses.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '--input-type=module',
          '-e',
          'const { default: Redis } = await import("ioredis"); const client = new Redis(process.env.REDIS_URL); try { await client.ping(); process.exit(0); } catch { process.exit(1); }',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

volumes:
  pgdata:
  # Redis' append-only file lives here: the queue, the repeatable jobs, the rate-limit
  # buckets and the failure counters all survive a restart with this volume present.
  redisdata:

# The default network is pinned so the web container can hold a fixed address: the API
# trusts that one address, not a subnet, as the only source of a forwarded client address.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/24
