name: abhyas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abhyas
      POSTGRES_PASSWORD: abhyas
      POSTGRES_DB: abhyas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U abhyas -d abhyas']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for development and CI only (decision 0038).
  #
  # MinIO's own images cannot be pulled anonymously from CI any more (minio/minio is not
  # on Docker Hub; quay.io/minio/minio answers "unauthorized"), and Bitnami no longer
  # publishes this image (its tag list is empty). Adobe S3Mock is the substitute: a
  # maintained S3 API server for local testing, path-style only, which is exactly how
  # the application talks to storage. Pinned by tag and by the manifest-list digest.
  # It is never used in production; production boot refuses it by configuration.
  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: abhyas-media
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/favicon.ico']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot migrations, as the owner role. Kept out of `up` by a profile so the
  # stack still starts with one command; run it explicitly once Postgres is up:
  #   docker compose run --rm migrate
  # The API itself never migrates and connects as the application role.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['tools']
    command:
      ['sh', '-c', 'cd /repo/apps/api && node node_modules/prisma/build/index.js migrate deploy']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://abhyas:abhyas@postgres:5432/abhyas
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: postgresql://abhyas_app:abhyas_app@postgres:5432/abhyas
      MIGRATION_DATABASE_URL: postgresql://abhyas:abhyas@postgres:5432/abhyas
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-insecure-secret-please-change-32chars
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      SMS_PROVIDER: fake
      EMAIL_PROVIDER: console
      # Shared with the web tier: the API asks it to drop cached catalog pages.
      REVALIDATE_SECRET: dev-only-revalidate-secret
      # The web container's own address, so revalidation works from inside the network.
      REVALIDATE_URL: http://web:3000/api/revalidate
      # Public base URL of the web app, used for links in email.
      WEB_URL: http://localhost:3000
      ALLOW_DEV_LOGIN: 'true'
      # Development object storage. The bucket is private and created at boot.
      S3_ENDPOINT: http://s3mock:9090
      S3_REGION: us-east-1
      S3_BUCKET: abhyas-media
      S3_ACCESS_KEY_ID: abhyas-dev
      S3_SECRET_ACCESS_KEY: abhyas-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
      # Development only: the web tier is the only proxy in front of the API, so the address
      # it forwards is believed. Production names its proxy instead (decision 0052).
      TRUST_PROXY: 'true'
      # Mobile OTP is off unless a developer turns it on; both tiers read the one switch.
      OTP_ENABLED: ${OTP_ENABLED:-false}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:3001
      # Public base URL of this app: the origin trusted for cookies and form posts.
      WEB_URL: http://localhost:3000
      # The API presents this on /api/revalidate before a cached page is dropped.
      REVALIDATE_SECRET: dev-only-revalidate-secret
      # Cloudflare's always-pass test site key; production refuses it.
      TURNSTILE_SITE_KEY: 1x0000000000000000000000000000000AA
      # The mobile screens and their routes exist only when the API serves them.
      OTP_ENABLED: ${OTP_ENABLED:-false}
      # Development only: believe the browser's forwarding header so the browser suite can use
      # a fresh address per test. Production boot refuses this switch (decision 0052).
      TRUST_FORWARDED_IP_FOR_TESTS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://abhyas_app:abhyas_app@postgres:5432/abhyas
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-insecure-secret-please-change-32chars
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      SMS_PROVIDER: fake
      EMAIL_PROVIDER: console
      ALLOW_DEV_LOGIN: 'true'
      # The import job stores images through the same private bucket as the API.
      S3_ENDPOINT: http://s3mock:9090
      S3_REGION: us-east-1
      S3_BUCKET: abhyas-media
      S3_ACCESS_KEY_ID: abhyas-dev
      S3_SECRET_ACCESS_KEY: abhyas-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      redis:
        condition: service_healthy
      s3mock:
        condition: service_healthy

volumes:
  pgdata:
